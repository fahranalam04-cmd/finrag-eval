[project]
name = "finrag-eval"
version = "0.1.0"
description = "Hybrid retrieval-augmented generation over FiQA-2018 financial QA, with a rigorous retrieval + generation evaluation harness"
readme = "README.md"
license = "MIT"
authors = [{ name = "Fahran Alam" }]
requires-python = ">=3.12,<3.13"
# Core deps are deliberately light (no torch) so CI and the API tests run without model downloads.
dependencies = [
    "numpy>=1.26",
    "bm25s>=0.2.6",
    "PyStemmer>=2.2",
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Everything that touches model weights / the real dataset.
ml = [
    "torch>=2.7",
    "transformers>=4.46",
    "sentence-transformers>=3.2",
    "accelerate>=1.0",
    "huggingface-hub>=0.26",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "ir-measures>=0.3.1",
]
ui = ["streamlit>=1.39"]

[project.scripts]
finrag = "finrag.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
